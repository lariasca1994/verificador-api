# Despliegue continuo: cada push a main empaqueta la app y actualiza el
# código de la función Lambda "verificador-api". Nada se despliega a mano.
#
# Autenticación: OIDC de GitHub -> rol IAM "verificador-api-github-deploy"
# (sin llaves de AWS guardadas en GitHub). El rol solo acepta tokens de
# ESTE repo y de la rama main, y solo puede actualizar esta función.
# Única configuración en GitHub: la variable de repositorio AWS_ROLE_ARN.
name: Desplegar en AWS Lambda

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lambda_handler.py'
      - 'requirements.txt'
      - '.github/workflows/desplegar.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: false

env:
  FUNCION: verificador-api
  AWS_REGION: us-east-1

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Mismo Python que el runtime de la función: las dependencias con
      # partes compiladas (psycopg2, bcrypt, pydantic-core) deben coincidir.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Armar el paquete
        run: |
          mkdir -p paquete
          pip install --quiet -r requirements.txt --target paquete
          cp -r app lambda_handler.py paquete/
          find paquete -name '__pycache__' -type d -prune -exec rm -rf {} +
          cd paquete && zip -qr ../funcion.zip .
          ls -lh ../funcion.zip

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar la función
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCION" \
            --zip-file fileb://funcion.zip \
            --query "LastModified" --output text
          aws lambda wait function-updated --function-name "$FUNCION"

      # Configuración desde GitHub: el correo de recuperación (Brevo) y la URL
      # pública se FUSIONAN con las variables que ya tiene la función
      # (DATABASE_URL, JWT_SECRET... no se tocan).
      - name: Actualizar la configuración de correo
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE: ${{ secrets.BREVO_REMITENTE }}
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
        run: |
          actual=$(aws lambda get-function-configuration --function-name "$FUNCION" --query 'Environment.Variables' --output json)
          jq -n --argjson v "$actual" --arg k "$BREVO_API_KEY" --arg r "$BREVO_REMITENTE" --arg u "$URL_PUBLICA" \
            '{Variables: ($v + {BREVO_API_KEY: $k, BREVO_REMITENTE: $r, URL_PUBLICA: $u})}' > entorno.json
          aws lambda update-function-configuration --function-name "$FUNCION" \
            --environment file://entorno.json --query "LastUpdateStatus" --output text
          rm -f entorno.json
          aws lambda wait function-updated --function-name "$FUNCION"

      # Depuración: los logs de la función se guardan 14 días (el valor de CloudWatch más
      # cercano a 15) y luego se borran solos.
      - name: Retención de logs de 14 días
        run: |
          aws logs put-retention-policy --log-group-name /aws/lambda/verificador-api --retention-in-days 14 \
            || echo "::warning::No se pudo fijar la retención de /aws/lambda/verificador-api"
